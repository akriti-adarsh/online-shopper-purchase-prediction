name: Validate experiment artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint application and tests
        run: python -m ruff check app.py shopper_app tests
      - name: Verify saved models and published results
        run: python scripts/verify_artifacts.py
      - name: Test dataset validation and application behavior
        run: python -m unittest discover -s tests -v
      - name: Test browser component focus behavior
        run: node --test tests/test_components.mjs
